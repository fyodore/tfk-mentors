# docker-compose.yml
services:
  web:
    build: .
    container_name: web
    command: python /code/manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/code
    ports:
      - 8000:8000
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      # Persist Linux node_modules (host bind-mount would overwrite /app otherwise).
      # Renamed volume to avoid stale layouts missing deps like react-router-dom.
      - frontend_nm:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://web:8000
    depends_on:
      - web
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${SQL_NAME}
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}

volumes:
  postgres_data:
  frontend_nm: